services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend-data:
