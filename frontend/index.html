<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites Lab Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">Favorites Lab</div>
      <nav>
        <a href="#" class="nav-link active" data-tab="home">Home</a>
        <a href="#" class="nav-link" data-tab="favorites">My Favorites</a>
      </nav>
      <div class="header-actions">
        <button id="theme-btn" class="icon-btn" title="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="cart-btn" class="icon-btn" title="Open cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
          <span id="cart-count" class="badge hidden">0</span>
        </button>
        <div id="auth-area">
          <button id="login-btn" class="btn-outline">Sign In</button>
          <div id="user-menu" style="display:none">
            <span id="user-name"></span>
            <button id="logout-btn" class="btn-outline">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="section-home" class="tab-content active">
      <div class="hero">
        <div class="hero-inner">
          <h2>Discover Products You'll Love</h2>
          <p>Browse, explore, and save your favorites for later.</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="category-filters" id="category-filters">
          <button class="chip active" data-cat="all">All</button>
        </div>
        <div class="view-controls">
          <span class="result-count" id="result-count"></span>
        </div>
      </div>

      <div id="products-grid"></div>

      <div class="pagination" id="pagination"></div>
    </section>

    <section id="section-favorites" class="tab-content">
      <h2>My Favorites</h2>
      <p class="section-sub">Products you've saved for later.</p>
      <div id="favorites-list"></div>
    </section>

    <section id="section-product" class="tab-content">
      <button id="product-back" class="back-btn">← Back</button>
      <div id="product-detail"></div>
    </section>
  </main>

  <!-- CART DRAWER -->
  <div id="cart-overlay" class="overlay hidden"></div>
  <div id="cart-drawer" class="drawer hidden">
    <div class="drawer-header">
      <h3>Shopping Cart</h3>
      <button id="cart-close" class="drawer-close">&times;</button>
    </div>
    <div id="cart-body" class="drawer-body"></div>
    <div class="drawer-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button id="cart-clear" class="btn-outline btn-sm">Clear Cart</button>
      <button class="btn-primary btn-sm" disabled>Checkout (soon)</button>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close">&times;</button>
      <div class="modal-tabs">
        <button class="modal-tab active" data-form="login">Sign In</button>
        <button class="modal-tab" data-form="register">Create Account</button>
      </div>

      <form id="login-form" class="auth-form">
        <h3>Welcome back</h3>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn-primary">Sign In</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form" style="display:none">
        <h3>Create your account</h3>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password (min 6 characters)" required>
        <button type="submit" class="btn-primary">Create Account</button>
        <p class="form-error" id="register-error"></p>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <footer>
    <p>Team: Stingy Namake &middot; Favorites Lab Store</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
