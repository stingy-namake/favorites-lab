<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites Lab Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">Favorites Lab</div>
      <nav>
        <a href="#" class="nav-link active" data-tab="home">Home</a>
        <a href="#" class="nav-link" data-tab="favorites">My Favorites</a>
      </nav>
      <div id="auth-area">
        <button id="login-btn" class="btn-outline">Sign In</button>
        <div id="user-menu" style="display:none">
          <span id="user-name"></span>
          <button id="logout-btn" class="btn-outline">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="section-home" class="tab-content active">
      <div class="hero">
        <div class="hero-inner">
          <h2>Discover Products You'll Love</h2>
          <p>Browse, explore, and save your favorites for later.</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="category-filters" id="category-filters">
          <button class="chip active" data-cat="all">All</button>
        </div>
        <div class="view-controls">
          <span class="result-count" id="result-count"></span>
        </div>
      </div>

      <div id="products-grid"></div>

      <div class="pagination" id="pagination"></div>
    </section>

    <!-- FAVORITES -->
    <section id="section-favorites" class="tab-content">
      <h2>My Favorites</h2>
      <p class="section-sub">Products you've saved for later.</p>
      <div id="favorites-list"></div>
    </section>
  </main>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close">&times;</button>
      <div class="modal-tabs">
        <button class="modal-tab active" data-form="login">Sign In</button>
        <button class="modal-tab" data-form="register">Create Account</button>
      </div>

      <form id="login-form" class="auth-form">
        <h3>Welcome back</h3>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn-primary">Sign In</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form" style="display:none">
        <h3>Create your account</h3>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password (min 6 characters)" required>
        <button type="submit" class="btn-primary">Create Account</button>
        <p class="form-error" id="register-error"></p>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <footer>
    <p>Team: Stingy Namake &middot; Favorites Lab Store</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
