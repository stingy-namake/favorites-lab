<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites Lab</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Favorites Lab</h1>
      <nav>
        <button class="tab active" data-tab="customers">Customers</button>
        <button class="tab" data-tab="products">Products</button>
        <button class="tab" data-tab="favorites">Favorites</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="section-customers" class="tab-content active">
      <h2>Manage Customers</h2>
      <form id="customer-form">
        <input type="hidden" id="customer-id">
        <input type="text" id="customer-name" placeholder="Name" required>
        <input type="email" id="customer-email" placeholder="Email" required>
        <button type="submit">Save</button>
        <button type="button" id="customer-cancel" class="btn-secondary" style="display:none">Cancel</button>
      </form>
      <div class="table-wrap">
        <table id="customers-table">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr>
          </thead>
          <tbody id="customers-list"></tbody>
        </table>
      </div>
    </section>

    <section id="section-products" class="tab-content">
      <h2>Products</h2>
      <div class="select-bar">
        <label>Add favorites for:</label>
        <select id="product-customer-select">
          <option value="">Select a customer</option>
        </select>
      </div>
      <div id="products-grid"></div>
    </section>

    <section id="section-favorites" class="tab-content">
      <h2>Favorites</h2>
      <div class="select-bar">
        <label>Customer:</label>
        <select id="favorites-customer-select">
          <option value="">Select a customer</option>
        </select>
      </div>
      <div id="favorites-list"></div>
    </section>
  </main>

  <footer>
    <p>Team: Stingy Namake</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
