name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: ./backend
      - run: npm start &
        working-directory: ./backend
      - run: sleep 3 && curl -s http://localhost:3000/api/products | head -c 100
        working-directory: ./backend
